<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Dialogue Box</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* ---- Controls (Editor panel) ---- */
        .controls {
            background: #111;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none; /* hidden until Edit pressed */
        }

        .controls.visible {
            display: block;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .controls h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #bbb;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input[type="text"],
        .input-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .input-group input[type="text"]:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #666;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 10px 15px;
            background: #222;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .file-input-label:hover {
            background: #333;
        }

        /* ---- Scene ---- */
        .scene {
            position: relative;
            background: #000;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 30px 30px 160px 30px;
            min-height: 480px;
            overflow: hidden;
        }

        .character-area {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            min-height: 280px;
            position: relative;
            z-index: 2;
        }

        .character-img {
            max-height: 280px;
            max-width: 280px;
            object-fit: contain;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        .character-placeholder {
            width: 160px;
            height: 220px;
            border: 2px dashed #444;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.85rem;
            text-align: center;
            padding: 10px;
        }

        /* ---- Dialogue Box ---- */
        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #0a0a0a;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 22px 25px;
            z-index: 10;
            min-height: 110px;
        }

        .character-name {
            position: absolute;
            top: -14px;
            left: 20px;
            background: #000;
            color: #fff;
            padding: 4px 18px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 2px solid #fff;
        }

        .dialogue-text {
            color: #fff;
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 50px;
            padding-top: 8px;
            word-wrap: break-word;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #fff;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.7s steps(1) infinite;
        }

        @keyframes blink {
            0%, 49%  { opacity: 1; }
            50%, 100%{ opacity: 0; }
        }

        /* ---- Buttons below scene ---- */
        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            background: #222;
            border-color: #555;
        }

        .action-btn.primary {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .action-btn.primary:hover {
            background: #ddd;
        }

        @media (max-width: 600px) {
            .scene {
                padding: 20px 20px 140px 20px;
                min-height: 420px;
            }

            .character-img {
                max-height: 200px;
                max-width: 200px;
            }

            .dialogue-text {
                font-size: 0.95rem;
            }

            .character-name {
                font-size: 0.8rem;
                padding: 3px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Editor panel (toggled by Edit button) -->
        <div class="controls" id="controls">
            <h2>✎ Edit Scene</h2>

            <div class="input-group">
                <label for="charName">Character Name</label>
                <input type="text" id="charName" placeholder="e.g., Sir Aldric" maxlength="20">
            </div>

            <div class="input-group">
                <label for="charImage">Character Image</label>
                <div class="file-input-wrapper">
                    <input type="file" id="charImage" accept="image/*">
                    <label for="charImage" class="file-input-label">📁 Upload Character Image</label>
                </div>
            </div>

            <div class="input-group">
                <label for="dialogueText">Dialogue</label>
                <textarea id="dialogueText" placeholder="Type what the character is saying..." maxlength="400"></textarea>
            </div>
        </div>

        <!-- Scene -->
        <div class="scene" id="scene">
            <div class="character-area" id="characterArea">
                <div class="character-placeholder" id="placeholder">
                    Upload a character<br>image to see it here
                </div>
            </div>

            <div class="dialogue-box">
                <div class="character-name" id="nameDisplay">Character</div>
                <div class="dialogue-text" id="textDisplay"><span class="cursor"></span></div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="button-row">
            <button class="action-btn" id="editBtn">✎ Edit</button>
            <button class="action-btn primary" id="replayBtn">↻ Replay</button>
        </div>
    </div>

    <script>
        const charName      = document.getElementById('charName');
        const charImage     = document.getElementById('charImage');
        const dialogueText  = document.getElementById('dialogueText');
        const nameDisplay   = document.getElementById('nameDisplay');
        const textDisplay   = document.getElementById('textDisplay');
        const characterArea = document.getElementById('characterArea');
        const placeholder   = document.getElementById('placeholder');
        const controls      = document.getElementById('controls');
        const editBtn       = document.getElementById('editBtn');
        const replayBtn     = document.getElementById('replayBtn');

        let typingTimeout = null;
        let currentTypingText = '';

        /* ---------- Typewriter effect ---------- */
        function typeText(text) {
            // Clear any ongoing animation
            clearTimeout(typingTimeout);
            currentTypingText = text;

            textDisplay.innerHTML = '<span class="cursor"></span>';
            const cursor = textDisplay.querySelector('.cursor');

            let i = 0;
            const speed = 40; // ms per character

            function step() {
                if (i < text.length) {
                    // Insert text node before cursor
                    cursor.insertAdjacentText('beforebegin', text.charAt(i));
                    i++;
                    typingTimeout = setTimeout(step, speed);
                }
                // When done, cursor stays blinking — nice subtle "ready" feel
            }
            step();
        }

        /* ---------- Live updates ---------- */
        charName.addEventListener('input', () => {
            nameDisplay.textContent = charName.value.trim() || 'Character';
        });

        dialogueText.addEventListener('input', () => {
            typeText(dialogueText.value);
        });

        charImage.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const existingImg = characterArea.querySelector('.character-img');
                if (existingImg) existingImg.remove();
                placeholder.style.display = 'none';

                const img = document.createElement('img');
                img.src = event.target.result;
                img.className = 'character-img';
                img.alt = 'Character';
                characterArea.appendChild(img);
            };
            reader.readAsDataURL(file);
        });

        /* ---------- Edit toggle ---------- */
        editBtn.addEventListener('click', () => {
            const isVisible = controls.classList.toggle('visible');
            editBtn.textContent = isVisible ? '✓ Done' : '✎ Edit';
        });

        /* ---------- Replay typewriter ---------- */
        replayBtn.addEventListener('click', () => {
            typeText(currentTypingText);
        });

        /* ---------- Initial demo text ---------- */
        window.addEventListener('load', () => {
            charName.value = 'Hero';
            nameDisplay.textContent = 'Hero';
            dialogueText.value = 'Greetings, traveler. What brings you to these lands?';
            typeText(dialogueText.value);
        });
    </script>
</body>
</html>
