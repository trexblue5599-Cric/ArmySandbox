<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Raw model check</title>
  <style>html,body{margin:0;height:100%;overflow:hidden;background:#9bd3f5}#info{position:fixed;top:8px;left:8px;right:8px;color:#fff;background:rgba(0,0,0,.5);padding:6px;border-radius:6px;font:14px sans-serif}</style>
</head>
<body>
  <div id="info">loading Dude_remastered.glb...</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    const info = document.getElementById('info');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
    cam.position.set(0, 0.2, 6); cam.lookAt(0, 0, 0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 1.0));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(3, 6, 4); scene.add(sun);

    new THREE.GLTFLoader().load('Dude_remastered.glb', gltf => {
      const root = gltf.scene;
      // report the raw numbers so we can compare with the analysis
      let meshes = 0, verts = 0, idx = 0;
      root.traverse(o => { if (o.isMesh) { meshes++; verts += o.geometry.attributes.position.count; idx += o.geometry.index ? o.geometry.index.count : 0; } });
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      root.position.sub(box.getCenter(new THREE.Vector3()));   // centre it on screen
      root.scale.setScalar(3 / size.y);                         // about 3 units tall
      scene.add(root);
      info.textContent = 'meshes ' + meshes + '  vertices ' + verts + '  index entries ' + idx +
        '  size x ' + size.x.toFixed(2) + ' y ' + size.y.toFixed(2) + ' z ' + size.z.toFixed(2);
    }, undefined, err => { info.textContent = 'could not load Dude_remastered.glb: ' + err; });

    (function frame() { requestAnimationFrame(frame); renderer.render(scene, cam); })();
  </script>
</body>
</html>
