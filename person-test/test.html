<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Person test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9bd3f5; font-family: sans-serif; }
    canvas { display: block; touch-action: none; }
    #info { position: fixed; top: 8px; left: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; font-size: 13px; }
    #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px; background: rgba(0,0,0,.45); display: flex; flex-wrap: wrap; gap: 6px; }
    button { padding: 9px 11px; border: 0; border-radius: 6px; background: #1565c0; color: #fff; font-size: 14px; }
  </style>
</head>
<body>
  <div id="info">loading dtwmp.glb...</div>
  <div id="ui">
    <button id="walk">Walk: off</button>
    <button id="speed">Speed: 2</button>
    <button id="look">New look</button>
    <button id="skin">Skin</button>
    <button id="hat">Hat</button>
    <button id="glass">Glasses</button>
    <button id="face">Face hair</button>
    <button id="back">Backpack</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
  <script src="accessory/registry.js"></script>
  <script src="accessory/hats.js"></script>
  <script src="accessory/outfits.js"></script>
  <script src="accessory/extras.js"></script>
  <script src="js/dude-mix.js"></script>
  <script>
    const info = document.getElementById('info');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.insertBefore(renderer.domElement, document.getElementById('info'));

    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 50);
    cam.position.set(0, 1.45, 6.2);
    cam.lookAt(0, 0.95, 0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 1.0));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(3, 6, 4);
    scene.add(sun);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(4, 40), new THREE.MeshLambertMaterial({ color: 0x7ed63c }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    let person = null, look = null, walkOn = false, speeds = [1, 2, 3.5], speedIdx = 1;
    const rnd = Math.random;
    const pickFrom = key => ACC.randomLook(rnd)[key];

    function show() {
      info.textContent = 'outfit: ' + look.outfit + '   hat: ' + look.hat + '   glasses: ' + look.glasses +
        '   face: ' + look.face + '   back: ' + look.back + '   skin: ' + look.skin;
    }
    function redress() { person.dress(look); show(); }

    dude.load(ready => {
      if (!ready) { info.textContent = 'dtwmp.glb did not load. Check the file is next to test.html.'; return; }
      look = ACC.randomLook(rnd);
      look.outfit = 'casual';
      person = dude.make(look);
      scene.add(person.group);
      show();
    });

    // drag to turn the person around
    let dragging = false, lastX = 0;
    renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; });
    window.addEventListener('pointerup', () => { dragging = false; });
    renderer.domElement.addEventListener('pointermove', e => {
      if (!dragging || !person) return;
      person.group.rotation.y += (e.clientX - lastX) * 0.01;
      lastX = e.clientX;
    });

    const btn = id => document.getElementById(id);
    btn('walk').onclick = () => { walkOn = !walkOn; btn('walk').textContent = 'Walk: ' + (walkOn ? 'on' : 'off'); };
    btn('speed').onclick = () => { speedIdx = (speedIdx + 1) % speeds.length; btn('speed').textContent = 'Speed: ' + speeds[speedIdx]; };
    btn('look').onclick = () => { if (!person) return; look = ACC.randomLook(rnd); look.outfit = 'casual'; redress(); };
    btn('skin').onclick = () => { if (!person) return; look.skin = (look.skin + 1) % ACC.SKINS.length; redress(); };
    btn('hat').onclick = () => { if (!person) return; look.hat = pickFrom('hat'); look.hc = 0; redress(); };
    btn('glass').onclick = () => { if (!person) return; look.glasses = pickFrom('glasses'); redress(); };
    btn('face').onclick = () => { if (!person) return; look.face = pickFrom('face'); look.fc = 0; redress(); };
    btn('back').onclick = () => { if (!person) return; look.back = pickFrom('back'); look.bc = 0; redress(); };

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (person) person.animate(dt, walkOn ? speeds[speedIdx] : 0);
      renderer.render(scene, cam);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    window.addEventListener('resize', () => {
      cam.aspect = window.innerWidth / window.innerHeight; cam.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
